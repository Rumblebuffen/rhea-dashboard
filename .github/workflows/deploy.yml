name: Snapshot, build, deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Snapshot public APIs
        run: npm run snapshot
        continue-on-error: true
        env:
          PREVIOUS_SNAPSHOT_URL: ${{ steps.pages.outputs.base_url }}/data/snapshot.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub disables scheduled workflows after 60 days without repository activity. An empty
      # commit after 45 quiet days keeps the snapshots running; GITHUB_TOKEN pushes don't retrigger.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep scheduled snapshots alive'
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
